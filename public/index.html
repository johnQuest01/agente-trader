<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agente Trader · Laboratório</title>
<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root {
    --bg: #0d1014; --panel: #151a21; --line: #232a34; --text: #d7dde5; --muted: #7d8896;
    --up: #2ebd85; --down: #f6465d; --accent: #f0b90b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.4 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 18px;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .pair { font-weight: 700; font-size: 16px; letter-spacing: .02em; }
  .price { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .up { color: var(--up); } .down { color: var(--down); }
  .tfs { display: flex; gap: 4px; }
  .tfs button {
    background: transparent; color: var(--muted); border: 1px solid var(--line);
    padding: 5px 10px; border-radius: 6px; cursor: pointer; font: inherit;
  }
  .tfs button:hover { color: var(--text); }
  .tfs button.on { color: #111; background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .stats { display: flex; flex-wrap: wrap; gap: 18px; margin-left: auto; }
  .stat { display: flex; flex-direction: column; }
  .stat span { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  .stat b { font-variant-numeric: tabular-nums; font-weight: 600; }
  .status { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--down); }
  .dot.live { background: var(--up); }
  .dot.fill { background: var(--accent); }
  #chart { flex: 1; min-height: 0; }
  #empty {
    position: fixed; inset: 0; display: none; place-items: center; text-align: center;
    color: var(--muted); pointer-events: none; padding: 24px;
  }
  .bar { height: 4px; width: 90px; background: var(--down); border-radius: 2px; overflow: hidden; margin-top: 5px; }
  .bar i { display: block; height: 100%; background: var(--up); width: 50%; }
</style>
</head>
<body>
<header>
  <div class="pair" id="pair">—</div>
  <div class="price" id="price">—</div>
  <div class="tfs" id="tfs"></div>
  <div class="stats">
    <div class="stat"><span>Variação do candle</span><b id="chg">—</b></div>
    <div class="stat"><span>Volume do candle</span><b id="vol">—</b></div>
    <div class="stat"><span>Agressão compradora</span><b id="buy">—</b><div class="bar"><i id="buybar"></i></div></div>
    <div class="status"><div class="dot" id="dot"></div><span id="st">conectando…</span></div>
  </div>
</header>
<div id="chart"></div>
<div id="empty">Ainda sem dados. O histórico está sendo baixado; a página atualiza sozinha.</div>

<script>
const $ = (id) => document.getElementById(id);
// O grafico trabalha em UTC; para mostrar o horario local do computador deslocamos cada
// candle pelo fuso vigente NAQUELE instante (assim horario de verao nao desloca o passado).
const toTime = (ms) => Math.floor(ms / 1000) - new Date(ms).getTimezoneOffset() * 60;
// Candle diario e o dia UTC da Binance (00:00 UTC = 21:00 em Sao Paulo): rotulamos pela
// data UTC, como a propria Binance faz, em vez de "dia anterior as 21:00".
const toDay = (ms) => new Date(ms).toISOString().slice(0, 10);
const UP = '#2ebd85', DOWN = '#f6465d';
const TF_MS = { '1m': 60e3, '5m': 300e3, '15m': 900e3, '1h': 3600e3, '4h': 14400e3, '1d': 86400e3 };

let tf = localStorage.getItem('tf') || '1m';
if (!TF_MS[tf]) { tf = '1m'; localStorage.setItem('tf', tf); }
let lastBar = null;      // ultimo candle do tempo grafico atual
let lastPrice = null;
let loading = false;
let loadSeq = 0;           // numero da carga mais recente; so ela pode desenhar no grafico
const missed = new Map();  // candles ao vivo que chegaram durante uma carga (o ultimo de cada minuto)

const chart = LightweightCharts.createChart($('chart'), {
  autoSize: true,
  layout: { background: { color: '#0d1014' }, textColor: '#9aa4b1' },
  grid: { vertLines: { color: '#1a2029' }, horzLines: { color: '#1a2029' } },
  rightPriceScale: { borderColor: '#232a34' },
  timeScale: { borderColor: '#232a34', timeVisible: true, secondsVisible: false },
  crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
});
const candles = chart.addCandlestickSeries({
  upColor: UP, downColor: DOWN, borderVisible: false, wickUpColor: UP, wickDownColor: DOWN,
});
const volume = chart.addHistogramSeries({
  priceFormat: { type: 'volume' }, priceScaleId: '',
  lastValueVisible: false, priceLineVisible: false, // nao poluir a escala de preco
});
volume.priceScale().applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });

const fmt = (n, d = 2) => n.toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
const barTime = (c) => (tf === '1d' ? toDay(c.openTime) : toTime(c.openTime));
const cBar = (c) => ({ time: barTime(c), open: c.open, high: c.high, low: c.low, close: c.close });
const vBar = (c) => ({ time: barTime(c), value: c.volume, color: (c.close >= c.open ? UP : DOWN) + '80' });

function showStats(c) {
  if (!c) return;
  const pct = c.open ? ((c.close - c.open) / c.open) * 100 : 0;
  $('chg').textContent = (pct >= 0 ? '+' : '') + fmt(pct) + '%';
  $('chg').className = pct >= 0 ? 'up' : 'down';
  $('vol').textContent = fmt(c.volume, 3);
  const buy = c.volume ? (c.takerBuyVolume / c.volume) * 100 : 50;
  $('buy').textContent = fmt(buy, 1) + '%';
  $('buybar').style.width = buy + '%';
}

function showPrice(p) {
  const el = $('price');
  el.textContent = fmt(p);
  if (lastPrice !== null && p !== lastPrice) el.className = 'price ' + (p > lastPrice ? 'up' : 'down');
  lastPrice = p;
  document.title = fmt(p) + ' · ' + $('pair').textContent;
}

async function load() {
  const seq = ++loadSeq;
  loading = true;
  clearTimeout(tailTimer); tailTimer = null; // atualizacao pendente do tempo grafico anterior
  try {
    const rows = await (await fetch(`/api/candles?tf=${tf}&limit=1500`)).json();
    // Se outra carga comecou enquanto esta esperava (troca rapida de tempo grafico ou
    // reconexao), esta resposta ja esta velha: so a carga mais recente desenha. Comparar so
    // o tempo grafico nao basta: duas cargas do mesmo tempo, ou ida e volta (1m, 1d, 1m),
    // passariam, e venceria a resposta que chegasse por ultimo.
    if (seq !== loadSeq) return;
    $('empty').style.display = rows.length ? 'none' : 'grid';
    chart.timeScale().applyOptions({ timeVisible: tf !== '1d' });
    candles.setData(rows.map(cBar));
    volume.setData(rows.map(vBar));
    lastBar = rows.at(-1) || null;
    if (lastBar) { showStats(lastBar); showPrice(lastBar.close); }
    // Poucas barras (ex.: 30 candles de 1d) ficariam espremidas na direita: ajusta a largura.
    if (rows.length * 6 < chart.timeScale().width()) chart.timeScale().fitContent();
    else chart.timeScale().scrollToRealTime();
  } finally {
    if (seq === loadSeq) {
      loading = false;
      // Aplica os candles ao vivo que chegaram durante a carga, na ordem em que vieram.
      const fila = [...missed.values()];
      missed.clear();
      for (const c of fila) applyCandle(c);
    }
  }
}

// Poe um candle na ponta do grafico. Nunca anda para tras: ignora candle anterior ao ultimo
// e ignora uma versao mais antiga do mesmo candle (o numero de negocios so cresce).
function putBar(c) {
  if (lastBar) {
    if (c.openTime < lastBar.openTime) return false;
    if (c.openTime === lastBar.openTime && c.trades < lastBar.trades) return false;
  }
  candles.update(cBar(c)); volume.update(vBar(c)); lastBar = c;
  return true;
}

// Atualiza so a ponta do grafico (os 2 ultimos candles) para tempos maiores que 1m.
let tailTimer = null;
function refreshTail() {
  if (tailTimer) return;
  tailTimer = setTimeout(async () => {
    tailTimer = null;
    if (loading) return;
    const seq = loadSeq;
    const rows = await (await fetch(`/api/candles?tf=${tf}&limit=2`)).json();
    if (seq !== loadSeq) return; // houve uma carga completa nesse meio tempo: ela e mais nova
    for (const r of rows) putBar(r);
    showStats(lastBar);
  }, 1500);
}

function applyCandle(c) {
  if (tf === '1m') {
    if (putBar(c)) { showStats(c); $('empty').style.display = 'none'; }
  } else {
    refreshTail();
  }
}

function onCandle(c) {
  showPrice(c.close);
  if (loading) { missed.set(c.openTime, c); return; } // a carga em andamento aplica depois
  applyCandle(c);
}

function onStatus(s) {
  const dot = $('dot');
  dot.className = 'dot' + (s.backfilling ? ' fill' : s.live ? ' live' : '');
  $('st').textContent = s.backfilling ? 'baixando histórico…' : s.live ? 'ao vivo' : 'desconectado';
  if (wasFilling && !s.backfilling) load(); // historico terminou: recarrega tudo
  wasFilling = s.backfilling;
}
let wasFilling = false;

function buildTfs() {
  $('tfs').innerHTML = '';
  for (const k of Object.keys(TF_MS)) {
    const b = document.createElement('button');
    b.textContent = k;
    b.className = k === tf ? 'on' : '';
    b.onclick = () => { tf = k; localStorage.setItem('tf', k); buildTfs(); load(); };
    $('tfs').appendChild(b);
  }
}

// Liga o fluxo ao vivo do servidor. Se a conexao cair e voltar, a pagina ficou um tempo sem
// receber candles: recarrega o grafico inteiro, senao sobra um buraco ate alguem apertar F5.
let dropped = false;
function connect() {
  const es = new EventSource('/api/stream');
  es.addEventListener('candle', (e) => onCandle(JSON.parse(e.data)));
  es.addEventListener('status', (e) => onStatus(JSON.parse(e.data)));
  es.onopen = () => {
    if (!dropped) return;
    dropped = false;
    load();
  };
  es.onerror = () => {
    dropped = true;
    $('dot').className = 'dot'; $('st').textContent = 'servidor parado';
    // O navegador costuma reconectar sozinho; se ele desistir (CLOSED), tentamos de novo.
    if (es.readyState === EventSource.CLOSED) setTimeout(connect, 3000);
  };
}

async function init() {
  const info = await (await fetch('/api/info')).json();
  $('pair').textContent = info.symbol.replace('USDT', '/USDT');
  buildTfs();
  onStatus(info);
  connect();    // liga o ao vivo antes da carga: o que chegar durante ela fica na fila
  await load();
}
init();
</script>
</body>
</html>
